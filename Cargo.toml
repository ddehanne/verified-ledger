[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/ledger-core",
    "crates/ledger-storage",
    "crates/ledger-cli",
]
[workspace.package]
edition = "2024"
license = "MIT"
[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
